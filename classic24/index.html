<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CLASSIC 24" />
  <title>CLASSIC 24</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="brand">CLASSIC<em>/24</em></div>
        <div class="subtitle" id="syncState">24 semanas al escenario</div>
      </div>
      <button class="icon-btn" data-act="settings" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
      </button>
    </header>

    <main id="content" class="content"></main>

    <div id="timerBar" class="timer-bar" hidden>
      <div><small id="timerLabel">Descanso</small><b id="timerLeft">00:00</b></div>
      <div class="row">
        <button class="btn small" data-act="timer-add" data-n="-15">−15s</button>
        <button class="btn small" data-act="timer-add" data-n="15">+15s</button>
        <button class="btn small danger" data-act="timer-stop">Parar</button>
      </div>
    </div>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button data-tab="today" class="nav-item active">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><small>Hoy</small>
      </button>
      <button data-tab="training" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg><small>Entreno</small>
      </button>
      <button data-tab="nutrition" class="nav-item">
        <svg viewBox="0 0 24 24"><circle cx="13" cy="12" r="6"/><path d="M4 3v6a2 2 0 0 0 2 2M6 3v18M8 3v6a2 2 0 0 1-2 2"/></svg><small>Comida</small>
      </button>
      <button data-tab="progress" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg><small>Progreso</small>
      </button>
      <button data-tab="prep" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4ZM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg><small>Prep</small>
      </button>
    </nav>
  </div>

  <dialog id="modal" class="modal"><div id="modalBody"></div></dialog>
  <div id="toast" class="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
