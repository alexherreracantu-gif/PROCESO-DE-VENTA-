<title>Plan 18 días Park Point</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: igual que el portal Park Point (blanco, azul de marca, tarjetas con sombra suave).
   En iPhone una columna con pestañas abajo; en pantalla ancha, barra lateral blanca. Solo tema claro, como el portal. */
:root {
  --bg: #f5f8fb;
  --surface: #ffffff;
  --surface-2: #edf2f7;
  --glass: rgb(255 255 255 / 0.94);
  --fg: #11141a;
  --muted: #586070;
  --subtle: #8b93a2;
  --line: #e0e7ef;
  --accent: #0b6fb3;
  --accent-soft: #e1f1fc;
  --on-accent: #ffffff;
  --bar: #159be6;
  --bar-track: #e2e8ef;
  --ok: #23774a;
  --ok-soft: #dcf0e3;
  --warn: #9a5f0e;
  --warn-soft: #f8ead2;
  --bad: #b3362d;
  --bad-soft: #f8e1de;
  --wa: #1f9d55;
  --brand: #159be6;
  --brand-deep: #0d7fc4;
  --side-2: #e8f4fd;
  --glow-a: rgb(21 155 230 / 0.09);
  --glow-b: rgb(21 155 230 / 0.06);
  --shadow: 0 1px 2px rgb(16 20 28 / 0.05), 0 6px 24px -14px rgb(16 20 28 / 0.14);
  --sans: "IBM Plex Sans", "Segoe UI", -apple-system, system-ui, sans-serif;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --tabs-h: 58px;
  color-scheme: light;
}
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  background-image:
    radial-gradient(900px 480px at 100% -8%, var(--glow-a), transparent 70%),
    radial-gradient(700px 420px at -10% 110%, var(--glow-b), transparent 70%);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
* { box-sizing: border-box; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
button:not(:disabled), label, summary { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input { font: inherit; color: inherit; }

/* ---------- Armazón ---------- */
.app { min-height: 100%; }
.lado { display: none; }
.cabeza {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: var(--glass);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.insignia {
  display: grid; place-items: center; width: 34px; height: 34px; flex: none;
  border-radius: 10px; background: var(--brand); color: var(--on-accent);
  font: 700 0.95rem/1 var(--display); letter-spacing: 0.04em;
}
.marca { min-width: 0; flex: 1; display: grid; }
.marca b { font: 700 1.3rem/1 var(--display); letter-spacing: 0.04em; }
.marca span { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.estado { display: inline-flex; align-items: center; gap: 6px; font-size: 0.74rem; color: var(--muted); white-space: nowrap; }
.estado i { width: 8px; height: 8px; border-radius: 50%; background: var(--subtle); flex: none; }
.estado[data-m="nube"] i { background: var(--ok); }
.estado[data-m="guardando"] i { background: var(--bar); }
.estado[data-m="error"] i { background: var(--warn); }

main {
  display: grid; gap: 14px; align-content: start;
  max-width: 760px; margin: 0 auto;
  padding-inline: 16px;
  padding-block: 16px calc(var(--tabs-h) + 26px);
}
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding: 4px 4px env(safe-area-inset-bottom, 0px);
}
.tab {
  position: relative; display: grid; justify-items: center; align-content: center; gap: 3px;
  min-height: 52px; padding: 6px 2px; border: 0; background: none;
  color: var(--subtle); font-size: 0.68rem; font-weight: 600; letter-spacing: 0.01em;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"]::before {
  content: ""; position: absolute; top: -4px; left: 30%; right: 30%; height: 3px;
  border-radius: 0 0 3px 3px; background: var(--brand);
}

@media (min-width: 960px) {
  .app { display: grid; grid-template-columns: 248px minmax(0, 1fr); }
  .cabeza, .tabs { display: none; }
  .lado {
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
    background: var(--surface); border-right: 1px solid var(--line);
  }
  .lado-marca { padding: 24px 20px 16px; display: grid; gap: 10px; }
  .lado-marca .fila { display: flex; align-items: center; gap: 10px; }
  .lado-marca b { font: 700 1.45rem/1 var(--display); letter-spacing: 0.04em; }
  .lado-eti { display: flex; align-items: center; gap: 8px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .lado-eti::before { content: ""; width: 16px; height: 1px; background: var(--brand); }
  .lado nav { flex: 1; padding: 6px 12px; display: grid; align-content: start; gap: 2px; }
  .lado .tab {
    display: flex; justify-content: flex-start; align-items: center; gap: 12px;
    min-height: 42px; padding: 0 12px; border-radius: 10px;
    font-size: 0.9rem; font-weight: 500; color: var(--fg);
  }
  .lado .tab svg { width: 18px; height: 18px; color: var(--muted); }
  .lado .tab:hover { background: var(--side-2); }
  .lado .tab[aria-current="page"] { background: var(--side-2); color: var(--accent); font-weight: 600; }
  .lado .tab[aria-current="page"] svg { color: var(--accent); }
  .lado .tab[aria-current="page"]::before { top: 8px; bottom: 8px; left: 0; right: auto; width: 3px; height: auto; border-radius: 0 3px 3px 0; }
  .lado-pie { padding: 14px 18px; border-top: 1px solid var(--line); display: grid; gap: 4px; }
  .lado-pie small { color: var(--muted); font-size: 0.74rem; }
  main { padding-block: 32px 48px; padding-inline: 32px; }
}

/* ---------- Piezas ---------- */
.eyebrow { display: flex; align-items: center; gap: 8px; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.eyebrow::before { content: ""; width: 16px; height: 2px; border-radius: 2px; background: var(--brand); }
.num { font-family: var(--display); font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: 0.005em; }
.titulo { display: grid; gap: 6px; }
.titulo h1 { font: 600 2.1rem/1 var(--display); letter-spacing: -0.005em; }
.titulo .sub { color: var(--muted); font-size: 0.9rem; max-width: 62ch; }

.tarjeta {
  min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 16px; box-shadow: var(--shadow); display: grid; gap: 12px;
  animation: entrar 0.45s cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.tarjeta:nth-child(2) { animation-delay: 0.03s; }
.tarjeta:nth-child(3) { animation-delay: 0.06s; }
.tarjeta:nth-child(4) { animation-delay: 0.09s; }
.tar-cab { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.tar-cab h2 { flex: 1; min-width: 0; font-size: 1rem; font-weight: 600; }
.tar-cab .nota { font-size: 0.78rem; color: var(--muted); }
.chip {
  display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
  padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 600;
  background: var(--surface-2); color: var(--muted);
}
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.azul { background: var(--accent-soft); color: var(--accent); }
.barra { position: relative; display: block; height: 8px; border-radius: 4px; background: var(--bar-track); overflow: visible; }
.barra i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--bar); transform-origin: left; animation: crecer 0.5s ease-out both; }
.barra b { position: absolute; top: -4px; bottom: -4px; width: 2px; border-radius: 1px; background: var(--fg); }
.aviso { border-radius: 14px; padding: 12px 14px; font-size: 0.88rem; background: var(--accent-soft); color: var(--fg); }
.aviso.ok { background: var(--ok-soft); }
.aviso.warn { background: var(--warn-soft); }
.aviso b { font-weight: 600; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 600; font-size: 0.92rem; box-shadow: var(--shadow);
}
.btn svg { width: 18px; height: 18px; }
.btn.prim { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.wa { background: var(--wa); border-color: var(--wa); color: var(--on-accent); }
.btn.ancho { width: 100%; }
.btn:active { transform: scale(0.98); }
.link { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 0.86rem; padding: 6px 0; min-height: 44px; }

/* Navegación de día */
.dia-nav { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center; gap: 8px; }
.dia-nav .centro { text-align: center; display: grid; gap: 4px; justify-items: center; }
.dia-nav h1 { font: 600 1.85rem/1.02 var(--display); }
.dia-nav p { font-size: 0.82rem; color: var(--muted); }
.ico-btn {
  display: grid; place-items: center; width: 48px; height: 48px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow);
}
.ico-btn svg { width: 22px; height: 22px; }
.ico-btn:disabled { opacity: 0.35; box-shadow: none; }

/* Contadores */
.cont { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding-block: 10px; border-top: 1px solid var(--line); }
.tar-cab + .cont { border-top: 0; padding-top: 2px; }
.cont-info { display: grid; gap: 4px; min-width: 0; }
.cont-et { font-weight: 600; font-size: 0.95rem; }
.cont-sub { font-size: 0.78rem; color: var(--muted); }
.cont.lleno .cont-sub { color: var(--ok); font-weight: 600; }
.cont.lleno .barra i { background: var(--ok); }
.cont-ctrl { display: flex; align-items: center; gap: 6px; }
.cont-num { min-width: 58px; text-align: center; font-size: 2.1rem; }
.cont-num small { font-size: 1.05rem; color: var(--subtle); font-weight: 500; }
.cont.lleno .cont-num { color: var(--ok); }
.btn-red {
  display: grid; place-items: center; width: 48px; height: 48px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--fg);
}
.btn-red svg { width: 22px; height: 22px; }
.btn-red.mas { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-red:disabled { opacity: 0.35; }
.btn-red:active { transform: scale(0.94); }

/* Pendientes */
.grupo-eti { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding-top: 4px; }
.lista { display: grid; }
.item {
  display: grid; grid-template-columns: 28px minmax(0, 1fr); align-items: start; gap: 12px;
  min-height: 52px; padding: 12px 2px; border-top: 1px solid var(--line);
}
.lista .item:first-child { border-top: 0; }
.item input {
  appearance: none; -webkit-appearance: none; margin: 0; width: 26px; height: 26px; border-radius: 8px;
  border: 2px solid var(--subtle); background: var(--surface); display: grid; place-items: center; flex: none;
  transition: background 0.15s, border-color 0.15s;
}
.item input::after {
  content: ""; width: 7px; height: 13px; margin-top: -3px;
  border: solid var(--on-accent); border-width: 0 3px 3px 0; transform: rotate(45deg) scale(0);
  transition: transform 0.15s;
}
.item input:checked { background: var(--ok); border-color: var(--ok); }
.item input:checked::after { transform: rotate(45deg) scale(1); }
.item-txt { font-size: 0.93rem; line-height: 1.4; padding-top: 2px; }
.item.on .item-txt { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--subtle); }
.hora { display: inline-block; margin-right: 8px; font: 500 0.76rem/1 var(--mono); color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 3px 6px; vertical-align: 1px; }
.item.on .hora { color: var(--muted); background: var(--surface-2); }
.dia-et { font-size: 0.78rem; font-weight: 600; color: var(--muted); padding-top: 8px; }

/* Avance */
.heroe { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
.heroe .grande { font-size: 4.2rem; }
.heroe .grande small { font-size: 1.8rem; color: var(--subtle); }
.heroe p { font-size: 0.86rem; color: var(--muted); }
.heroe h2 { font-size: 1.05rem; font-weight: 600; }
.metrica { display: grid; gap: 6px; padding-block: 10px; border-top: 1px solid var(--line); }
.tar-cab + .metrica { border-top: 0; padding-top: 0; }
.metrica .fila { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.metrica .fila span:first-child { flex: 1; font-weight: 600; font-size: 0.92rem; }
.metrica .val { font-weight: 600; font-variant-numeric: tabular-nums; }
.leyenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.74rem; color: var(--muted); }
.leyenda span { display: inline-flex; align-items: center; gap: 6px; }
.leyenda i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal .cab { text-align: center; font-size: 0.7rem; font-weight: 600; color: var(--subtle); }
.dia-c {
  aspect-ratio: 1; max-width: 100%; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; align-content: center; gap: 2px; padding: 0;
}
.dia-c .num { font-size: 1.25rem; }
.dia-c small { font-size: 0.6rem; color: var(--muted); font-weight: 600; }
.dia-c.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.dia-c.medio { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.dia-c.nada { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.dia-c.fut { background: var(--surface-2); border-color: transparent; color: var(--subtle); }
.dia-c.hoy { outline: 2px solid var(--accent); outline-offset: 1px; }
.consejos { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.consejos li { font-size: 0.9rem; padding-left: 16px; position: relative; }
.consejos li::before { content: ""; position: absolute; left: 0; top: 0.6em; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }

/* Plan */
.embudo { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.embudo div { background: var(--surface-2); border-radius: 12px; padding: 10px 8px; text-align: center; display: grid; gap: 4px; }
.embudo .num { font-size: 1.9rem; color: var(--accent); }
.embudo small { font-size: 0.7rem; color: var(--muted); line-height: 1.2; }
.regla { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.88rem; color: var(--muted); }
.regla b { font: 700 1.3rem/1 var(--display); color: var(--fg); letter-spacing: 0.04em; }
.meta-fase { font-size: 0.86rem; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.fase.actual { border-color: var(--bar); }
.no-hacer { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 0.9rem; }

/* Mensajes */
.campo-et { font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.campo {
  width: 100%; min-width: 0; min-height: 48px; padding: 10px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); font-size: 16px;
}
.campo:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.msg h2 { font-size: 0.95rem; font-weight: 600; }
.msg-txt {
  background: var(--accent-soft); border-radius: 4px 16px 16px 16px; padding: 12px 14px;
  font-size: 0.94rem; line-height: 1.5; -webkit-user-select: text; user-select: text; white-space: pre-wrap;
}
.msg .cuando { font-size: 0.78rem; color: var(--muted); }

/* Estudio */
.pitch { font-size: 1rem; line-height: 1.55; border-left: 3px solid var(--brand); padding-left: 12px; }
.modelo { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding-block: 10px; border-top: 1px solid var(--line); align-items: baseline; }
.tar-cab + .modelo { border-top: 0; padding-top: 0; }
.modelo b { font-weight: 600; font-size: 0.92rem; }
.modelo .precio { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 0.92rem; text-align: right; }
.modelo small { font-size: 0.76rem; color: var(--muted); }
.modelo .chip { justify-self: end; }
.tabla-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 6px; border-top: 1px solid var(--line); }
th { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border-top: 0; }
td:not(:first-child), th:not(:first-child) { text-align: right; }
details { border-top: 1px solid var(--line); }
.tar-cab + details { border-top: 0; }
summary { list-style: none; display: flex; align-items: center; gap: 10px; min-height: 48px; font-weight: 600; font-size: 0.92rem; }
summary::-webkit-details-marker { display: none; }
summary::after { content: ""; margin-left: auto; width: 8px; height: 8px; border: solid var(--muted); border-width: 0 2px 2px 0; transform: rotate(45deg); transition: transform 0.2s; }
details[open] summary::after { transform: rotate(-135deg); }
details p { padding: 0 0 12px; font-size: 0.9rem; color: var(--muted); }
.externo { color: var(--accent); font-weight: 600; font-size: 0.9rem; text-decoration: none; }

.toast {
  position: fixed; left: 16px; right: 16px; z-index: 50;
  bottom: calc(var(--tabs-h) + 14px + env(safe-area-inset-bottom, 0px));
  display: flex; justify-content: center; pointer-events: none;
}
.toast span {
  background: var(--fg); color: var(--on-accent); border-radius: 12px; padding: 10px 14px;
  font-size: 0.86rem; font-weight: 500; box-shadow: var(--shadow); animation: entrar 0.25s ease-out both; max-width: 420px;
}
@media (min-width: 960px) { .toast { bottom: 24px; } }

@keyframes entrar { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes crecer { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 380px) {
  .cont-num { min-width: 50px; font-size: 1.85rem; }
  .btn-red { width: 44px; height: 44px; }
  .embudo .num { font-size: 1.6rem; }
}
</style>

<div class="app">
  <aside class="lado" aria-label="Menú">
    <div class="lado-marca">
      <div class="fila"><span class="insignia" aria-hidden="true">PP</span><b>PARK POINT</b></div>
      <span class="lado-eti">Plan 18 días</span>
    </div>
    <nav id="nav-lado" aria-label="Secciones"></nav>
    <div class="lado-pie">
      <span class="estado" data-m="conectando"><i></i><span>Conectando…</span></span>
      <small>Del 12 al 29 de octubre de 2026</small>
    </div>
  </aside>

  <div class="col">
    <header class="cabeza">
      <span class="insignia" aria-hidden="true">PP</span>
      <span class="marca"><b>PARK POINT</b><span>Plan 18 días</span></span>
      <span class="estado" data-m="conectando"><i></i><span>Conectando…</span></span>
    </header>
    <main id="main"></main>
  </div>

  <nav class="tabs" id="nav-tabs" aria-label="Secciones"></nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  /* ================= Contenido del plan ================= */
  var DIAS = 18;
  var DOW = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
  var DOW_C = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];

    var texto = meta ? (lleno ? "Meta cumplida" : "Meta " + meta + " · faltan " + (meta - v)) : sub;
    return '<div class="cont' + (lleno ? " lleno" : "") + '">' +
      '<div class="cont-info"><span class="cont-et">' + et + '</span><span class="cont-sub">' + texto + "</span>" +
      (meta ? '<span class="barra" aria-hidden="true"><i style="width:' + pct + '%"></i></span>' : "") + "</div>" +
      '<div class="cont-ctrl">' +
      '<button type="button" class="btn-red" data-act="menos" data-c="' + c + '" data-k="menos-' + c + '" aria-label="Restar uno en ' + et + '"' + (v <= 0 ? " disabled" : "") + ">" + I.menos + "</button>" +
      '<span class="cont-num num">' + v + (meta ? "<small>/" + meta + "</small>" : "") + "</span>" +
      '<button type="button" class="btn-red mas" data-act="mas" data-c="' + c + '" data-k="mas-' + c + '" aria-label="Sumar uno en ' + et + '">' + I.mas + "</button>" +
      "</div></div>";
  }

  function vHoy() {
    var n = diaVista, f = fechaDeDia(n), c = contDe(f), fase = faseDe(n), hoyN = diaHoy();
    var esp = especialesDe(n), hab = habitosDe(n), todos = esp.concat(hab);
    var hechos = todos.filter(function (i) { return S.hechos[i.key]; }).length;
    var metas = metasCumplidas(c);
    var total = totales();
    var banner = "";
    if (hoyN < 1) banner = '<div class="aviso">El plan arranca el <b>lunes 12 de octubre</b>. Ya puedes revisar lo que toca cada día.</div>';
    else if (hoyN > DIAS) banner = '<div class="aviso">El plan terminó el jueves 29. Revisa tu resultado en <b>Avance</b>.</div>';
    else if (n > hoyN) banner = '<div class="aviso">Estás viendo un día que todavía no llega.</div>';
    if (metas && hechos === todos.length) banner = '<div class="aviso ok"><b>Día cumplido.</b> 6-2-1 y todos los pendientes listos.</div>';
    var etFase = "Fase " + fase.n + ": " + fase.titulo;
    return '' +
      '<section class="titulo"><p class="eyebrow">Requerimientos diarios</p>' +
      '<div class="dia-nav">' +
      '<button type="button" class="ico-btn" data-act="dia" data-d="-1" data-k="dia-prev" aria-label="Día anterior"' + (n <= 1 ? " disabled" : "") + ">" + I.izq + "</button>" +
      '<div class="centro"><h1>' + cap(largo(n)) + '</h1><p>Día ' + n + " de " + DIAS + " · " + etFase + "</p>" +
      (n !== clamp(hoyN) ? '<button type="button" class="link" data-act="ir" data-n="' + clamp(hoyN) + '" data-k="ir-hoy">Volver a hoy</button>' : "") + "</div>" +
      '<button type="button" class="ico-btn" data-act="dia" data-d="1" data-k="dia-next" aria-label="Día siguiente"' + (n >= DIAS ? " disabled" : "") + ">" + I.der + "</button>" +
      "</div></section>" + banner +
      '<section class="tarjeta"><div class="tar-cab"><h2>Regla 6-2-1</h2><span class="chip ' + (metas ? "ok" : "azul") + '">' + (metas ? "Cumplida" : "Meta del día") + "</span></div>" +
      contador("conv", "Conversaciones nuevas", 6, c.conv) +
      contador("citas", "Citas agendadas", 2, c.citas) +
      contador("pruebas", "Pruebas de manejo", 1, c.pruebas) +
      "</section>" +
      '<section class="tarjeta"><div class="tar-cab"><h2>Créditos y ventas</h2><span class="nota">Llevas ' + total.sep + " de 3 ventas</span></div>" +
      contador("creditos", "Solicitudes de crédito", null, c.creditos, "INE, 3 estados de cuenta y comprobante") +
      contador("sep", "Separaciones (ventas)", null, c.sep, "Crédito aprobado y $5,000, o contado") +
      "</section>" +
      '<section class="tarjeta"><div class="tar-cab"><h2>Pendientes del día</h2><span class="chip ' + (hechos === todos.length ? "ok" : "") + '">' + hechos + " de " + todos.length + "</span></div>" +
      (esp.length ? '<p class="grupo-eti">Lo especial de hoy</p><div class="lista">' + esp.map(function (i) { return itemHtml(i.key, i.t, i.hora); }).join("") + "</div>" : "") +
      '<p class="grupo-eti">Todos los días</p><div class="lista">' + hab.map(function (i) { return itemHtml(i.key, i.t, i.hora); }).join("") + "</div>" +
      '<p class="cont-sub">Los prospectos de Meta y del cotizador se contestan en menos de 5 minutos, a la hora que lleguen.</p>' +
      "</section>" +
      '<button type="button" class="btn wa ancho" data-act="corte" data-k="corte">' + I.copiar + "Copiar corte del día para WhatsApp</button>";
  }

  function vAvance() {
    var t = totales(), hoyN = diaHoy(), ref0 = Math.max(0, Math.min(DIAS, hoyN)), e = esperado(ref0);
    var atras = MET.filter(function (m) { return t[m.c] < e[m.c]; });
    var filas = MET.map(function (m) {
      var pct = Math.min(100, t[m.c] / m.total * 100), marca = Math.min(100, e[m.c] / m.total * 100);
      var falta = e[m.c] - t[m.c];
      var chip = falta > 0 ? '<span class="chip warn">Faltan ' + falta + " para hoy</span>" : '<span class="chip ok">Al día</span>';
      return '<div class="metrica"><div class="fila"><span>' + m.et + '</span><span class="val">' + t[m.c] + " / " + m.total + "</span>" + chip + "</div>" +
        '<span class="barra"><i style="width:' + pct + '%"></i>' + (ref0 > 0 ? '<b style="left:calc(' + marca + '% - 1px)" title="Meta al cierre de hoy"></b>' : "") + "</span></div>";
    }).join("");
    var cal = ["L", "M", "M", "J", "V", "S", "D"].map(function (d) { return '<span class="cab">' + d + "</span>"; }).join("");
    for (var n = 1; n <= DIAS; n++) {
      var cls = n > hoyN ? "fut" : estadoDia(n);
      if (n === hoyN && cls === "nada") cls = "fut";
      if (n === hoyN) cls += " hoy";
      cal += '<button type="button" class="dia-c ' + cls + '" data-act="ir" data-n="' + n + '" data-k="cal-' + n + '" aria-label="' + cap(largo(n)) + '"><span class="num">' + fechaUTC(n).getUTCDate() + "</span><small>Día " + n + "</small></button>";
    }
    var ventas = t.sep;
    return '' +
      '<section class="titulo"><p class="eyebrow">Avance</p><h1>3 unidades en 18 días</h1><p class="sub">Del lunes 12 al jueves 29 de octubre. El bono de octubre se acaba el sábado 31.</p></section>' +
      '<section class="tarjeta"><div class="heroe"><span class="num grande" style="color:' + (ventas >= 3 ? "var(--ok)" : "var(--fg)") + '">' + ventas + "<small>/3</small></span>" +
      "<div><h2>" + (ventas >= 3 ? "¡Meta cumplida!" : "Ventas") + "</h2><p>Separación con crédito aprobado, o contado. Persigue 4: un crédito se puede caer.</p></div></div>" +
      '<span class="barra"><i style="width:' + Math.min(100, ventas / 3 * 100) + '%"></i></span></section>' +
      '<section class="tarjeta"><div class="tar-cab"><h2>Acumulado contra el plan</h2><span class="nota">' + (ref0 > 0 ? "La rayita negra es lo que deberías llevar al cierre de hoy" : "Arranca el lunes 12") + "</span></div>" + filas + "</section>" +
      (ref0 > 0 ? '<section class="tarjeta"><div class="tar-cab"><h2>' + (atras.length ? "Qué ajustar" : "Vas al día") + "</h2></div>" +
        (atras.length ? '<ul class="consejos">' + atras.map(function (m) { return "<li><b>" + m.et + ":</b> " + CONSEJOS[m.c] + "</li>"; }).join("") + "</ul>"
          : '<p class="cont-sub">Sigue con la regla 6-2-1. Lo que sigue: ' + esc(especialesDe(clamp(hoyN))[0] ? especialesDe(clamp(hoyN))[0].t : "tus pendientes de todos los días") + ".</p>") + "</section>" : "") +
      '<section class="tarjeta"><div class="tar-cab"><h2>Tus 18 días</h2><span class="nota">Toca un día para abrirlo</span></div><div class="cal">' + cal + "</div>" +
      '<div class="leyenda"><span><i style="background:var(--ok-soft)"></i>Cumplido</span><span><i style="background:var(--warn-soft)"></i>A medias</span><span><i style="background:var(--bad-soft)"></i>Sin registro</span><span><i style="background:var(--surface-2)"></i>Por venir</span></div></section>';
  }

  function vPlan() {
    var hoyN = diaHoy();
    var fases = FASES.map(function (f) {
      var actual = hoyN >= f.desde && hoyN <= f.hasta, paso = hoyN > f.hasta;
      var chip = actual ? '<span class="chip azul">En curso</span>' : paso ? '<span class="chip ok">Terminada</span>' : '<span class="chip">Próxima</span>';
      var dias = "";
      for (var n = f.desde; n <= f.hasta; n++) {
        var esp = especialesDe(n);
        dias += '<p class="dia-et">' + corto(n) + " · Día " + n + '</p><div class="lista">' + esp.map(function (i) { return itemHtml(i.key, i.t); }).join("") + "</div>";
      }
      return '<section class="tarjeta fase' + (actual ? " actual" : "") + '"><div class="tar-cab"><div style="flex:1;min-width:0"><p class="eyebrow">Fase ' + f.n + " · " + corto(f.desde) + " al " + corto(f.hasta) + "</p><h2>" + f.titulo + "</h2></div>" + chip + "</div>" +
        '<p class="meta-fase"><b>Meta al cierre:</b> ' + f.meta + "</p>" + dias + "</section>";
    }).join("");
    return '' +
      '<section class="titulo"><p class="eyebrow">Plan</p><h1>Las cuentas hacia atrás</h1><p class="sub">Con las proporciones de tu tablero de KPIs: 1 de cada 3 conversaciones da cita y cierras 1 de cada 4 pruebas.</p></section>' +
      '<section class="tarjeta"><div class="embudo">' +
      '<div><span class="num">96</span><small>conversaciones</small></div><div><span class="num">32</span><small>citas</small></div><div><span class="num">16</span><small>pruebas</small></div><div><span class="num">4</span><small>separaciones</small></div></div>' +
      '<p class="regla"><b>6-2-1</b> diario: 6 conversaciones nuevas, 2 citas, 1 prueba de manejo.</p>' +
      '<div class="aviso warn"><b>Pregúntale a Jorge</b> qué cuenta para la meta del mes: apartada, facturada o entregada. Si cuenta la facturada, los créditos entran a más tardar el miércoles 21.</div></section>' +
      fases +
      '<section class="tarjeta"><div class="tar-cab"><h2>Lo que no se hace</h2></div><ul class="no-hacer">' +
      "<li>Mandar «¿sigues interesado?»</li><li>Enseñar todo el catálogo</li><li>Inventar especificaciones, garantías o tiempos de carga</li><li>Pedir la separación antes de la aprobación del crédito</li><li>Dejar un prospecto sin siguiente acción y fecha en el CRM</li><li>Prometer entrega con adeudo pendiente</li></ul></section>";
  }

  function textoMsg(m) { return m.b.replace(/\{yo\}/g, S.nombre ? S.nombre : "{tu nombre}"); }
  function vMensajes() {
    return '' +
      '<section class="titulo"><p class="eyebrow">Mensajes</p><h1>Listos para WhatsApp</h1><p class="sub">Copia, pega y cambia lo que va entre llaves. Breves y con una razón para contestar.</p></section>' +
      '<section class="tarjeta"><label class="campo-et" for="nombre">Tu nombre (se pone solo en los mensajes)</label>' +
      '<input class="campo" id="nombre" type="text" autocomplete="given-name" placeholder="Ej. Alex" value="' + esc(S.nombre) + '"></section>' +
      MENSAJES.map(function (m, i) {
        return '<section class="tarjeta msg"><div class="tar-cab"><h2>' + m.t + '</h2></div><p class="cuando">' + m.cuando + '</p>' +
          '<p class="msg-txt" id="msg-' + i + '">' + esc(textoMsg(m)) + "</p>" +
          '<button type="button" class="btn" data-act="copiar" data-i="' + i + '" data-k="copiar-' + i + '">' + I.copiar + "Copiar mensaje</button></section>";
      }).join("");
  }

  function vEstudio() {
    var cat = CATALOGO.map(function (m) {
      return '<div class="modelo"><b>' + m[0] + '</b><span class="precio">' + pesos(m[2]) + "</span>" +
        "<small>" + m[1] + (m[4] ? " · " + m[4] : "") + "</small>" +
        (m[3] ? '<span class="chip ok">Bono ' + pesos(m[3]) + "</span>" : '<span class="chip">Sin bono</span>') + "</div>";
    }).join("");
    return '' +
      '<section class="titulo"><p class="eyebrow">Estudio</p><h1>BYD al 100%</h1><p class="sub">Una hora antes del turno, del lunes 12 al viernes 16. Tu curso es la Academia BYD del portal.</p></section>' +
      '<section class="tarjeta"><div class="tar-cab"><h2>Plan de 5 días</h2><span class="chip">' + ESTUDIO.filter(function (e) { return S.hechos[e.id]; }).length + " de 5</span></div><div class=\"lista\">" +
      ESTUDIO.map(function (e) { return itemHtml(e.id, cap(largo(e.dia)) + ": " + e.t + ". Ya quedó si: " + e.listo + "."); }).join("") + "</div></section>" +
      '<section class="tarjeta"><div class="tar-cab"><h2>BYD en 30 segundos</h2><span class="nota">De memoria</span></div>' +
      '<p class="pitch">«BYD empezó fabricando baterías y hoy fabrica en casa la batería, los motores, la electrónica y los chips de sus autos. Por eso te da más tecnología por tu dinero. En 2025 fue el fabricante de autos eléctricos e híbridos enchufables más grande del mundo, y en México ya vende más que marcas como Ford. Tu próximo BYD empieza aquí: te acompaño de la cotización a la entrega.»</p></section>' +
      '<section class="tarjeta"><div class="tar-cab"><h2>Catálogo de octubre</h2><span class="nota">Precio con IVA · bono solo financiando desde 5%</span></div>' + cat +
      '<p class="cont-sub">Las mensualidades «desde» son de la campaña oficial. Al cliente dale siempre la del Cotizador.</p></section>' +
      '<section class="tarjeta"><div class="tar-cab"><h2>Tasas Banorte</h2></div><div class="tabla-wrap"><table><thead><tr><th>Enganche</th><th>Tasa</th><th>Comisión</th></tr></thead><tbody>' +
      BANORTE.map(function (r) { return "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td><td>" + r[2] + "</td></tr>"; }).join("") + "</tbody></table></div>" +
      '<p class="cont-sub">Placas MTY: eléctrico $1,760 · híbrido $5,866 · gestoría $3,016. Separación $5,000 a Accesorios.</p></section>' +
      '<section class="tarjeta"><div class="tar-cab"><h2>Las 8 objeciones</h2></div>' +
      OBJECIONES.map(function (o) { return "<details><summary>" + o[0] + "</summary><p>" + o[1] + "</p></details>"; }).join("") + "</section>" +
      '<section class="tarjeta"><div class="tar-cab"><h2>Guía completa</h2></div><p class="cont-sub">Historia de la marca, tecnología explicada, diagnóstico y fuentes.</p>' +
      '<a class="externo" href="https://github.com/alexherreracantu-gif/PROCESO-DE-VENTA-/blob/claude/dreamy-euler-ow3wpq/docs/byd-guia-de-estudio.md" target="_blank" rel="noopener">Abrir la guía de estudio →</a></section>';
  }

  var VISTAS = { hoy: vHoy, avance: vAvance, plan: vPlan, mensajes: vMensajes, estudio: vEstudio };

  /* ================= Render y eventos ================= */
  var $main = document.getElementById("main");
  function navHtml() {
    return TABS.map(function (x) {
      return '<button type="button" class="tab" data-tab="' + x.id + '"' + (x.id === tab ? ' aria-current="page"' : "") + ">" + I[x.ico] + "<span>" + x.et + "</span></button>";
    }).join("");
  }
  function render() {
    var a = document.activeElement, k = a && a.dataset ? a.dataset.k : null;
    $main.innerHTML = VISTAS[tab]();
    document.getElementById("nav-tabs").innerHTML = navHtml();
    document.getElementById("nav-lado").innerHTML = navHtml();
    if (k) {
      var el = $main.querySelector('[data-k="' + k + '"]');
      if (el && !el.disabled) el.focus({ preventScroll: true });
    }
  }
  function irA(t) {
    tab = t;
    try { localStorage.setItem(LLAVE + "-tab", t); } catch (e) {}
    try { history.replaceState(null, "", "#" + t); } catch (e) {}
    render();
    window.scrollTo(0, 0);
  }
  document.addEventListener("click", function (ev) {
    var tb = ev.target.closest("[data-tab]");
    if (tb) { irA(tb.dataset.tab); return; }
    var b = ev.target.closest("[data-act]");
    if (!b || b.disabled) return;
    var act = b.dataset.act;
    if (act === "mas" || act === "menos") {
      var f = fechaDeDia(diaVista), c = contDe(f), k = b.dataset.c;
      c[k] = Math.max(0, c[k] + (act === "mas" ? 1 : -1));
      S.cont[f] = c;
      cambio();
    } else if (act === "dia") {
      diaVista = clamp(diaVista + Number(b.dataset.d)); render();
    } else if (act === "ir") {
      diaVista = clamp(Number(b.dataset.n));
      if (tab !== "hoy") irA("hoy"); else render();
    } else if (act === "corte") {
      copiar(textoCorte());
    } else if (act === "copiar") {
      copiar(textoMsg(MENSAJES[Number(b.dataset.i)]), document.getElementById("msg-" + b.dataset.i));
    }
  });
  document.addEventListener("change", function (ev) {
    var el = ev.target;
    if (el.matches && el.matches('input[type="checkbox"][data-id]')) {
      if (el.checked) S.hechos[el.dataset.id] = true; else delete S.hechos[el.dataset.id];
      cambio();
    }
  });
  var tNombre = null;
  document.addEventListener("input", function (ev) {
    if (ev.target.id !== "nombre") return;
    S.nombre = ev.target.value.slice(0, 40);
    MENSAJES.forEach(function (m, i) { var p = document.getElementById("msg-" + i); if (p) p.textContent = textoMsg(m); });
    guardarLocal();
    clearTimeout(tNombre);
    tNombre = setTimeout(function () { cambio(false); }, 600);
  });

  function textoCorte() {
    var n = diaVista, c = contDe(fechaDeDia(n)), t = totales();
    return "Corte " + largo(n) + " · Día " + n + " de " + DIAS + "\n" +
      "Conversaciones nuevas: " + c.conv + "/6\n" +
      "Citas agendadas: " + c.citas + "/2\n" +
      "Pruebas de manejo: " + c.pruebas + "/1\n" +
      "Solicitudes de crédito: " + c.creditos + "\n" +
      "Separaciones: " + c.sep + "\n" +
      "Acumulado: " + t.sep + " de 3 ventas · " + t.pruebas + "/16 pruebas · " + t.citas + "/32 citas · " + t.conv + "/96 conversaciones";
  }
  var tToast = null;
  function toast(msg) {
    var el = document.getElementById("toast");
    el.innerHTML = "<span>" + esc(msg) + "</span>";
    clearTimeout(tToast);
    tToast = setTimeout(function () { el.innerHTML = ""; }, 2600);
  }
  function seleccionar(el) {
    if (!el) return;
    try { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
  }
  function copiar(txt, el) {
    var hecho = function () { toast("Copiado. Pégalo en WhatsApp."); };
    var respaldo = function () {
      var ok = false;
      try {
        var ta = document.createElement("textarea");
        ta.value = txt; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.top = "0"; ta.style.opacity = "0"; ta.style.fontSize = "16px";
        document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
        ok = document.execCommand("copy"); ta.remove();
      } catch (e) {}
      if (ok) hecho();
      else { seleccionar(el); toast("No se pudo copiar solo: mantén presionado el texto y elige Copiar."); }
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(hecho, respaldo);
      else respaldo();
    } catch (e) { respaldo(); }
  }

  render();
  ponerModo("conectando");
  conectar();
})();
</script>
