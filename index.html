<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Expedientes de venta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f6f8; --surface: #ffffff; --surface-2: #eef1f5; --text: #0f172a; --muted: #5b6475; --border: #dde2ea;
      --accent: #0e7c66; --accent-strong: #0a5f4e; --accent-soft: #dff3ee; --on-accent: #ffffff; --wa: #1faa53;
      --ok: #15803d; --ok-soft: #dcfce7; --bad: #b91c1c; --bad-soft: #fee2e2; --warn: #b45309; --warn-soft: #fef3c7;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b1016; --surface: #121a23; --surface-2: #19232f; --text: #e8edf3; --muted: #9aa6b5; --border: #263241;
        --accent: #35c9a5; --accent-strong: #5fdcbc; --accent-soft: #123a33; --on-accent: #06221b; --wa: #2bc766;
        --ok: #4ade80; --ok-soft: #12321f; --bad: #f87171; --bad-soft: #3a1515; --warn: #f0a44b; --warn-soft: #3a2a10;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0b1016; --surface: #121a23; --surface-2: #19232f; --text: #e8edf3; --muted: #9aa6b5; --border: #263241;
      --accent: #35c9a5; --accent-strong: #5fdcbc; --accent-soft: #123a33; --on-accent: #06221b; --wa: #2bc766;
      --ok: #4ade80; --ok-soft: #12321f; --bad: #f87171; --bad-soft: #3a1515; --warn: #f0a44b; --warn-soft: #3a2a10;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Inter", system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
    a { color: var(--accent); }

    header.top { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    header.top .wrap { display: flex; align-items: center; gap: 12px; height: 58px; }
    .logo { font-weight: 800; letter-spacing: -.02em; text-decoration: none; color: var(--text); }
    .logo small { color: var(--muted); font-weight: 500; margin-left: 6px; }
    .topnav { display: flex; gap: 4px; margin-left: auto; }
    .topnav a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: .9rem; padding: 8px 12px; border-radius: 8px; }
    .topnav a[aria-current="page"] { color: var(--text); background: var(--surface-2); }
    main { padding: 24px 0 80px; }
    h1 { font-size: 1.6rem; letter-spacing: -.02em; margin: 0 0 4px; }
    h2 { font-size: 1.25rem; letter-spacing: -.01em; margin: 0 0 4px; }
    h3 { font-size: 1rem; margin: 0 0 10px; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .spacer { flex: 1; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 10px; padding: 10px 16px;
      font: inherit; font-weight: 700; font-size: .92rem; cursor: pointer; background: var(--accent); color: var(--on-accent); text-decoration: none; }
    .btn:hover { background: var(--accent-strong); }
    .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn.ghost:hover { background: var(--surface-2); }
    .btn.wa { background: var(--wa); color: #fff; }
    .btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--border); }
    .btn.sm { padding: 7px 11px; font-size: .82rem; border-radius: 8px; }
    .btn.lg { padding: 13px 22px; font-size: 1rem; }

    /* Tablero */
    .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
    .stat b { display: block; font-size: 1.6rem; line-height: 1.1; letter-spacing: -.02em; }
    .stat span { color: var(--muted); font-size: .8rem; font-weight: 600; }
    .clients { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
    .client { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .client .name { font-weight: 800; font-size: 1.05rem; }
    .client .meta { color: var(--muted); font-size: .85rem; }
    .bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
    .next { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: .88rem; }
    .next b { display: block; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .tag { display: inline-block; font-size: .72rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); margin-right: 4px; }
    .tag.pn { background: var(--accent-soft); color: var(--accent-strong); }
    .tag.warn { background: var(--warn-soft); color: var(--warn); }
    .tag.ok { background: var(--ok-soft); color: var(--ok); }
    .empty { color: var(--muted); text-align: center; padding: 48px 16px; border: 1px dashed var(--border); border-radius: 16px; }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .filters button { font: inherit; font-size: .85rem; font-weight: 600; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
    .filters button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

    /* Expediente */
    .exp { display: grid; grid-template-columns: 260px 1fr; gap: 20px; align-items: start; }
    .stepper { position: sticky; top: 78px; display: flex; flex-direction: column; gap: 4px; }
    .stepper button { display: flex; align-items: center; gap: 10px; text-align: left; font: inherit; font-size: .9rem; font-weight: 600;
      padding: 9px 10px; border-radius: 10px; border: 0; background: transparent; color: var(--text); cursor: pointer; }
    .stepper button:hover { background: var(--surface-2); }
    .stepper button[aria-current="step"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); }
    .stepper .dot { width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: .78rem; font-weight: 800;
      border: 2px solid var(--border); color: var(--muted); background: var(--surface); }
    .stepper .done .dot { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .stepper .current .dot { border-color: var(--accent); color: var(--accent); }
    .stepper .skip { opacity: .45; }
    .stepper .skip .dot { border-style: dashed; }
    .exp-head { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 16px; }
    .coach { background: var(--accent-soft); border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; }
    .coach summary { font-weight: 700; cursor: pointer; color: var(--accent-strong); }
    .coach ul { margin: 8px 0 0; padding-left: 20px; }
    .coach li { margin: 4px 0; }
    .objetivo { font-size: 1.02rem; font-weight: 600; margin: 0 0 14px; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
    .f.full { grid-column: 1 / -1; }
    .f[hidden] { display: none; }
    label.l { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: .86rem; margin-bottom: 5px; }
    label.l .req { color: var(--bad); }
    .inp { display: flex; gap: 6px; }
    input[type="text"], input[type="tel"], input[type="number"], input[type="email"], input[type="date"], select, textarea {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: .95rem; min-width: 0; }
    textarea { min-height: 80px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    .f.missing input, .f.missing select { border-color: var(--bad); }
    .f.missing .checkline { box-shadow: inset 0 0 0 1px var(--bad); }
    .hint { color: var(--muted); font-size: .8rem; margin-top: 4px; }
    .checkline { display: flex; gap: 10px; align-items: center; background: var(--surface-2); border-radius: 10px; padding: 11px 12px; cursor: pointer; font-weight: 600; font-size: .92rem; }
    .checkline input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; margin: 0; }
    .calcv { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .calcv.ok { background: var(--ok-soft); color: var(--ok); }
    .calcv.bad { background: var(--bad-soft); color: var(--bad); }
    .copy { flex: none; }
    .ledger { width: 100%; border-collapse: collapse; font-size: .93rem; }
    .ledger td { padding: 7px 0; border-bottom: 1px solid var(--border); }
    .ledger td:last-child { text-align: right; font-weight: 700; white-space: nowrap; padding-left: 8px; font-variant-numeric: tabular-nums; }
    .ledger tr.t td { font-size: 1rem; border-bottom: 0; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 0; padding-top: 16px; border-top: 1px solid var(--border); }
    .footer-step { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 18px; }
    .errors { background: var(--bad-soft); color: var(--bad); border-radius: 12px; padding: 12px 14px; margin-top: 14px; font-weight: 600; font-size: .9rem; }
    .errors ul { margin: 6px 0 0; padding-left: 18px; font-weight: 500; }
    .done-banner { background: var(--ok-soft); color: var(--ok); border-radius: 12px; padding: 10px 14px; font-weight: 700; margin-bottom: 14px; font-size: .9rem; }
    .log { list-style: none; padding: 0; margin: 0; font-size: .85rem; }
    .log li { padding: 6px 0; border-bottom: 1px solid var(--border); color: var(--muted); }
    .log li b { color: var(--text); }

    /* Aprende */
    .learn { display: grid; gap: 12px; }
    .learn .card h3 { display: flex; gap: 10px; align-items: center; }
    .learn .num { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: .82rem; flex: none; }
    .learn ul { margin: 0; padding-left: 20px; color: var(--muted); }
    .pend { display: grid; gap: 10px; }
    .pend .card { padding: 14px; }
    .pend label { font-weight: 600; font-size: .92rem; display: block; margin-bottom: 6px; }

    dialog { border: 1px solid var(--border); border-radius: 16px; background: var(--surface); color: var(--text); width: calc(100% - 32px); max-width: 600px; padding: 20px; }
    dialog::backdrop { background: rgba(0,0,0,.5); }
    dialog textarea { min-height: 220px; }
    .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px;
      font-weight: 600; font-size: .9rem; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; max-width: calc(100% - 32px); }
    .toast.show { opacity: 1; }
    #print { display: none; }

    @media (max-width: 860px) {
      .exp { grid-template-columns: 1fr; }
      .stepper { position: static; flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; scrollbar-width: thin; }
      .stepper button { flex: none; padding: 7px 10px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); }
      .stepper button span.t { display: none; }
      .stepper button[aria-current="step"] span.t { display: inline; }
      .fields { grid-template-columns: 1fr; }
      .clients { grid-template-columns: 1fr; }
      .topnav a { padding: 8px; }
      .logo small { display: none; }
    }
    @media print {
      body > *:not(#print) { display: none !important; }
      #print { display: block; color: #000; font-family: Arial, sans-serif; padding: 24px; }
      #print table { width: 100%; border-collapse: collapse; margin-top: 12px; }
      #print td { border: 1px solid #000; padding: 10px; font-size: 14px; }
      #print td:first-child { font-weight: bold; width: 40%; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="logo" href="#/">Expedientes <small id="hdrAsesor"></small></a>
      <nav class="topnav">
        <a href="#/" data-nav="clientes">Clientes</a>
        <a href="#/aprende" data-nav="aprende">Aprende</a>
      </nav>
    </div>
  </header>

  <main class="wrap" id="app"></main>

  <dialog id="dlgMsg">
    <form method="dialog">
      <h3 id="msgTitle">Mensaje</h3>
      <div id="msgPara" hidden style="margin-bottom:10px"><label class="l" for="msgTo">Para</label><input id="msgTo" type="email"></div>
      <textarea id="msgText" aria-label="Texto del mensaje"></textarea>
      <p class="hint">Puedes editar el texto antes de enviarlo.</p>
      <div class="row" style="margin-top:10px">
        <button class="btn" type="button" id="msgGo">Abrir</button>
        <button class="btn ghost" type="button" id="msgCopy">Copiar</button>
        <span class="spacer"></span>
        <button class="btn ghost" value="close">Cerrar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgBackup">
    <form method="dialog">
      <h3>Respaldo</h3>
      <p class="hint" style="margin-top:0">Tus expedientes viven solo en este navegador. Descarga un respaldo seguido, o úsalo para pasarlos a otro dispositivo.</p>
      <div class="row" style="margin:12px 0">
        <button class="btn" type="button" id="bkDown">Descargar respaldo</button>
        <label class="btn ghost" style="margin:0">Restaurar archivo<input type="file" id="bkFile" accept="application/json" hidden></label>
        <button class="btn ghost" type="button" id="bkCsv">Exportar a Excel (CSV)</button>
      </div>
      <button class="btn ghost" value="close">Cerrar</button>
    </form>
  </dialog>

  <div id="print"></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="assets/config.js"></script>
  <script src="assets/pasos.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
