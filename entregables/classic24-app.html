  --good:#5b9c70; --warn:#e9a23b; --bad:#e0604c;
  --brown:#2b211b;
  --top-safe:env(safe-area-inset-top,0px); --bottom-safe:env(safe-area-inset-bottom,0px);
  --font:"Geist",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --serif:"Geist",-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  --shadow:0 1px 1px rgba(60,48,30,.04),0 12px 32px -12px rgba(60,48,30,.14);
  --radius:26px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
body{min-height:100%;font-size:15px;line-height:1.45;font-weight:400}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 30% at 10% 8%,rgba(185,205,176,.55),transparent 70%),radial-gradient(38% 28% at 95% 22%,rgba(156,195,230,.45),transparent 70%),radial-gradient(45% 30% at 70% 95%,rgba(247,190,150,.35),transparent 70%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:active:not(:disabled){transform:scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--g3);outline-offset:2px}
h1,h2,h3{text-wrap:balance;font-weight:400}
svg{flex:none}
[hidden]{display:none!important}
.visually-hidden{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.muted{color:var(--muted)}
.mini{font-size:13px}
.tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.mt{margin-top:12px}
.full{width:100%}
#app{overflow-x:clip}

.glass{background:var(--glass);-webkit-backdrop-filter:saturate(1.4) blur(22px);backdrop-filter:saturate(1.4) blur(22px);border:1px solid var(--glass-b);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px}
.card{display:block;width:100%;background:var(--glass);border:1px solid var(--glass-b);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;color:var(--ink);text-align:left}
.card+.card,.glass+.glass{margin-top:12px}

/* ---------- Barra superior y navegación ---------- */
.topbar{position:sticky;top:0;z-index:20;padding:calc(10px + var(--top-safe)) 18px 8px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(243,241,236,.92),rgba(243,241,236,.6));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.brand{font-family:var(--serif);font-size:21px;font-weight:650;line-height:1;letter-spacing:-.035em}
.brand em{font-style:normal;font-weight:300;color:var(--g2)}
.subtitle{font-size:11px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px}
.subtitle::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dim)}
.subtitle.cloud::before{background:var(--good)}
.subtitle.error::before{background:var(--warn)}
.icon-btn{border:1px solid var(--glass-b);background:var(--glass);color:var(--ink);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;box-shadow:var(--shadow)}

.content{padding:0 18px calc(150px + var(--bottom-safe));max-width:640px;margin:0 auto}

.bottom-nav{position:fixed;z-index:30;left:12px;right:12px;bottom:calc(10px + var(--bottom-safe));max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:6px;border-radius:28px;background:rgba(255,255,255,.78);-webkit-backdrop-filter:saturate(1.6) blur(24px);backdrop-filter:saturate(1.6) blur(24px);border:1px solid var(--glass-b);box-shadow:0 18px 40px -16px rgba(60,48,30,.35)}
.nav-item{border:0;background:transparent;color:var(--dim);padding:6px 2px;display:flex;flex-direction:column;gap:2px;align-items:center}
.nav-item svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-item small{font-size:10px;font-weight:500}
.nav-item.active{color:var(--ink)}
.nav-item.active svg{stroke-width:2}
.nav-plus{justify-self:center;width:52px;height:52px;border-radius:50%;border:0;background:var(--brown);color:#fff;display:grid;place-items:center;box-shadow:0 10px 22px -8px rgba(43,33,27,.6)}
.nav-plus svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

/* ---------- Encabezados ---------- */
.ph{padding:14px 2px 8px}
.ph small{display:block;font-size:12.5px;color:var(--muted)}
.ph small::first-letter{text-transform:uppercase}
.ph h1{margin:4px 0 0;font-family:var(--serif);font-size:36px;font-weight:600;line-height:1.05;letter-spacing:-.045em;overflow-wrap:anywhere}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:28px 4px 12px}
.sec h2{font-family:var(--serif);font-size:21px;font-weight:600;margin:0;line-height:1.1;letter-spacing:-.03em}
.chip-n{font-size:12px;font-weight:500;color:var(--ink2);background:var(--glass);border:1px solid var(--glass-b);border-radius:99px;padding:4px 10px;white-space:nowrap}
.link{border:0;background:none;color:var(--ink);font-weight:500;font-size:14px;padding:0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--dim)}
.big-inline{font-size:24px;font-weight:300;letter-spacing:-.02em}
.big-inline small{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0}

.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 14px;padding:5px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--shadow)}
.datebar b{display:flex;flex-direction:column;align-items:center;font-size:15px;font-weight:600;line-height:1.15}
.datebar b small{font-size:11px;color:var(--muted);font-weight:400}
.nb{width:38px;height:38px;border-radius:50%;border:0;background:var(--solid);display:grid;place-items:center;color:var(--ink);box-shadow:0 1px 3px rgba(60,48,30,.1)}
.nb svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nb:disabled{opacity:.35}

/* ---------- Arco de calorías ---------- */
.fuel{position:relative;padding:18px 16px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:4px}
.gauge{grid-column:2;grid-row:1;width:220px;max-width:58vw;height:auto;display:block}
.gauge .anim{animation:draw 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes draw{from{stroke-dasharray:0 var(--c)}to{stroke-dasharray:var(--len) var(--c)}}
.g-big{fill:var(--ink);font-family:var(--font);font-size:44px;font-weight:300;letter-spacing:-.03em}
.g-sub{fill:var(--muted);font-family:var(--font);font-size:12px}
.fuel-side{grid-column:1;grid-row:1;align-self:start;display:flex;flex-direction:column;padding-top:4px;min-width:0}
.fuel-side.r{grid-column:3;text-align:right}
.fuel-side b{font-size:18px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.fuel-side small{font-size:11px;color:var(--muted)}
.macro-rings{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.mr{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;color:var(--ink)}
.mr small{font-size:12px;color:var(--muted)}
.mr-v{fill:var(--ink);font-family:var(--font);font-size:14px;font-weight:500}
.mr-v.big{font-size:17px}
.mr-u{font-size:10px;fill:var(--muted)}
.ring{display:block}
.ring .anim{animation:draw 1s cubic-bezier(.2,.8,.2,1) both}
.macro-bars{grid-column:1/-1;display:grid;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.mb>span:first-child{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.mb small{font-size:13px;color:var(--ink2);font-weight:500;display:flex;align-items:center;gap:7px}
.mb small::before{content:"";width:8px;height:8px;border-radius:50%}
.mb.p small::before{background:var(--c-p)} .mb.c small::before{background:var(--c-c)} .mb.f small::before{background:var(--c-f)}
.mb b{font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.mb b em{font-style:normal;font-size:12px;color:var(--muted);font-weight:400}

.bar{display:block;height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.bar.grad>i{background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3))}
.bar.bp>i{background:var(--c-p)} .bar.bc>i{background:var(--c-c)} .bar.bf>i{background:var(--c-f)}
.bar.ok>i,.bar.volt>i{background:var(--good)} .bar.mid>i{background:var(--warn)} .bar.lo>i,.bar.over>i{background:var(--bad)}
.bar.thick{height:8px}

/* ---------- Tareas del día ---------- */
.tasks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.task{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;text-align:left;color:var(--ink);padding:13px 14px;border-radius:22px;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--glass-b);box-shadow:var(--shadow)}
.task-top{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:8px}
.task-ico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--solid);color:var(--ink2);box-shadow:0 1px 3px rgba(60,48,30,.08)}
.task-ico svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.task b{font-size:14.5px;font-weight:600;line-height:1.2}
.task small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.task.s-ok{background:linear-gradient(160deg,rgba(214,234,210,.85),rgba(255,255,255,.6))}
.task.s-ok .task-ico{color:var(--good)}
.task.s-miss{background:linear-gradient(160deg,rgba(250,221,212,.85),rgba(255,255,255,.6))}
.task.s-miss .task-ico{color:var(--bad)}
.st{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.st svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.st.ok{background:var(--good);color:#fff}
.st.miss{background:var(--bad);color:#fff}
.st.pending{border:1.5px solid var(--dim)}
.st.na{border:1.5px dashed var(--track)}

/* ---------- Sesión y cuenta regresiva ---------- */
.session{display:flex;align-items:center;gap:14px;width:100%;margin-top:12px;padding:18px;text-align:left;color:var(--ink)}
.session-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.session-main small{font-size:12.5px;color:var(--muted)}
.session-main b{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.1;letter-spacing:-.035em;overflow-wrap:anywhere}
.session-meta{font-size:13px;color:var(--ink2);margin-bottom:8px}
.go{flex:none;width:46px;height:46px;border-radius:50%;background:var(--brown);color:#fff;display:grid;place-items:center}
.go svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.show-card{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:12px;border:0;border-radius:var(--radius);padding:20px;text-align:left;color:#f6efe7;background:radial-gradient(80% 90% at 100% 0%,rgba(242,112,138,.28),transparent 60%),radial-gradient(70% 80% at 0% 100%,rgba(247,178,103,.22),transparent 60%),var(--brown);box-shadow:0 18px 40px -18px rgba(43,33,27,.7)}
.show-card small{font-size:12.5px;color:#cdbfb2}
.show-n{display:flex;align-items:flex-end;gap:12px}
.show-n b{font-family:var(--serif);font-size:76px;line-height:.9;font-weight:200;letter-spacing:-.06em}
.show-n span{font-size:14px;line-height:1.25;color:#e6d9cc;padding-bottom:6px}
.show-line{position:relative;display:block;height:3px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:8px}
.show-line i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--g1),var(--g2))}
.show-line em{position:absolute;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(242,112,138,.35)}
.show-foot{display:flex;justify-content:space-between;font-size:11.5px;color:#b8a99b}

/* ---------- Semana ---------- */
.wbars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wbar{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:transparent;padding:0;color:var(--ink);min-width:0}
.wbar-track{position:relative;width:100%;max-width:30px;height:84px;border-radius:99px;background:var(--track);display:flex;align-items:flex-end;overflow:hidden}
.wbar-track i{display:block;width:100%;border-radius:99px;background:var(--warn)}
.wbar-track i.grow{animation:grow .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.wbar.hi .wbar-track i{background:linear-gradient(180deg,#8cc49a,var(--good))}
.wbar.mid .wbar-track i{background:linear-gradient(180deg,var(--g1),var(--warn))}
.wbar.lo .wbar-track i{background:linear-gradient(180deg,#f19a86,var(--bad))}
.wbar.now .wbar-track i{background:linear-gradient(180deg,var(--g1),var(--g2),var(--g3))}
.wbar-d{font-size:11px;color:var(--muted);font-weight:500}
.wbar-n{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.wbar.is-today .wbar-n{background:var(--brown);color:#fff}
.wbar.off{opacity:.45}
.k{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 4px 0 8px;background:var(--warn)}
.k.hi{background:var(--good)} .k.lo{background:var(--bad)} .k.off{background:var(--track)}

/* ---------- Pastillas / selectores ---------- */
.pills{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 14px;padding:2px 18px 6px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill-btn{flex:none;border:1px solid var(--glass-b);background:var(--glass);color:var(--ink2);border-radius:99px;padding:9px 15px;font-size:13.5px;font-weight:500;box-shadow:0 1px 2px rgba(60,48,30,.05)}
.pill-btn.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.pill-btn.today:not(.on){border-color:var(--g2);color:var(--ink)}
.mp{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:99px;font-size:10.5px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
.mp.p{background:var(--c-p)} .mp.c{background:var(--c-c)} .mp.f{background:var(--c-f)}
.fr-pills{display:flex;gap:4px;flex:none}

/* ---------- Entreno ---------- */
.stats{display:flex;align-items:center;gap:16px;padding:16px;margin-bottom:12px}
.stats-g{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats-g b{display:block;font-size:22px;font-weight:400;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats-g small{font-size:11.5px;color:var(--muted)}
.exercise{padding:16px;margin-top:10px}
.ex-top{display:flex;gap:12px;align-items:flex-start}
.ex-n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--solid);font-size:14px;font-weight:600;box-shadow:0 1px 3px rgba(60,48,30,.1)}
.ex-n svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round}
.exercise.all-done .ex-n{background:var(--good)}
.ex-name{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ex-name b{font-size:16.5px;font-weight:600;line-height:1.2}
.ex-name small{font-size:12px;color:var(--muted)}
.timer-chip{flex:none;display:flex;align-items:center;gap:5px;border:0;background:var(--solid);color:var(--ink2);border-radius:99px;padding:7px 11px;font-size:12px;font-weight:500;box-shadow:0 1px 3px rgba(60,48,30,.1)}
.timer-chip svg{width:14px;height:14px;fill:none;stroke:var(--g2);stroke-width:2}
.last{font-size:12.5px;color:var(--muted);margin:10px 0 0 46px;display:flex;flex-wrap:wrap;gap:4px 8px}
.last b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.up-badge{display:inline-block;margin:8px 0 0 46px;font-size:12px;font-weight:600;color:#fff;border-radius:99px;padding:5px 11px;background:linear-gradient(90deg,var(--g1),var(--g2))}
.sets{margin:10px 0 0 46px}
.set-row{display:grid;grid-template-columns:14px 1fr 1fr 1fr 40px;gap:6px;align-items:center;margin-top:6px}
.set-row.head div{font-size:10.5px;color:var(--muted);text-align:center}
.set-n{font-size:12px;color:var(--dim);font-weight:600;text-align:center}
.set-row input{padding:10px 2px;text-align:center;font-variant-numeric:tabular-nums;font-weight:500;border-radius:14px;border:1px solid transparent;background:var(--solid);font-size:16px;box-shadow:inset 0 0 0 1px var(--line)}
.set-row.is-done input{background:#e9f3eb;color:var(--good);box-shadow:none}
.done-box{position:relative;display:grid;place-items:center;height:40px}
.done-box input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.done-box span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--dim);color:transparent;transition:background .15s}
.done-box span svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.done-box input:checked+span{background:var(--brown);border-color:var(--brown);color:#fff}
.done-box input:focus-visible+span{outline:2px solid var(--g3);outline-offset:2px}
.ex-note{margin:10px 0 0 46px;width:calc(100% - 46px)!important;font-size:13px!important;padding:9px 12px!important;background:transparent!important;border:1px dashed var(--track)!important;border-radius:14px!important}
.check.solo{margin-top:12px;padding:14px 16px;gap:12px;justify-content:flex-start;font-size:14px;display:flex;align-items:center}
.notes{padding:4px 16px}
.notes>div{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.notes>div:last-child{border:0}
.notes b{font-family:var(--serif);font-size:14px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.notes span{font-size:13.5px;color:var(--ink2)}

/* ---------- Comida ---------- */
.list{padding:2px 14px}
.food-row{display:flex;width:100%;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:12px 0;text-align:left}
.food-row:last-child{border:0}
.fr-main{flex:1;min-width:0}
.fr-main b{display:block;font-size:14.5px;font-weight:500}
.fr-main small{font-size:12px;color:var(--muted)}
.add{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--brown);color:#fff}
.add svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.log-card{border-radius:var(--radius);padding:8px 16px 12px;background:var(--brown);color:#f6efe7;box-shadow:0 18px 40px -18px rgba(43,33,27,.6)}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:-.02em;margin:14px 0 2px}
.meal-h span{font-family:var(--font);font-size:11.5px;color:#b8a99b}
.log-row{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-top:6px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.log-row>span:first-child{flex:1;min-width:0}
.log-row b{display:block;font-size:14px;font-weight:500}
.log-row small{font-size:11.5px;color:#b8a99b}
.del{flex:none;border:0;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);color:#f6efe7;display:grid;place-items:center}
.del svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.check{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.check:last-child{border:0;padding-bottom:0}
.check:first-child{padding-top:0}
.check label{display:flex;align-items:center;gap:12px;flex:1;font-size:15px}
.check input[type=checkbox]{width:22px;height:22px;accent-color:var(--brown);flex:none}

/* ---------- Progreso ---------- */
.score-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.score-top small{display:block;font-size:13px;color:var(--muted)}
.score-top b{font-size:58px;font-weight:300;line-height:1;letter-spacing:-.04em}
.score-top b em{font-style:normal;font-size:24px;color:var(--muted)}
.score-top b.hi{color:var(--good)} .score-top b.lo{color:var(--bad)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.lg{display:grid;grid-template-columns:1fr auto;gap:5px 8px;align-items:baseline;min-width:0}
.lg span{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg b{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.lg .bar{grid-column:1/-1;height:5px}
.fix{display:flex;gap:12px;padding:14px 16px;margin-top:10px}
.fix-dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--warn);margin-top:6px;box-shadow:0 0 0 4px rgba(233,162,59,.18)}
.fix.bad .fix-dot{background:var(--bad);box-shadow:0 0 0 4px rgba(224,96,76,.16)}
.fix b{display:block;font-size:15px;font-weight:600}
.fix small{display:block;font-size:12px;color:var(--muted);margin:2px 0 6px}
.fix p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink2)}
.fix p b{display:inline;font-size:inherit}
.fix-text{color:var(--ink2);margin-top:5px;line-height:1.45}
.day-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.day-item:last-child{border-bottom:0}
.day-score{display:flex;align-items:flex-end;gap:12px;margin:4px 0 10px}
.day-score b{font-size:56px;font-weight:300;line-height:1;letter-spacing:-.04em}
.day-score b em{font-style:normal;font-size:22px;color:var(--muted)}
.day-score b.hi{color:var(--good)} .day-score b.lo{color:var(--bad)}
.day-score span{font-size:13px;color:var(--muted);padding-bottom:8px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mk{padding:14px 12px;display:flex;flex-direction:column;gap:1px;min-width:0;border-radius:22px}
.mk small{font-size:11.5px;color:var(--muted)}
.mk b{font-size:26px;font-weight:300;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.mk span{font-size:11.5px;color:var(--muted)}
.mk em{font-style:normal;font-size:11px;font-weight:600;margin-top:6px;align-self:flex-start;padding:3px 8px;border-radius:99px}
.mk.ok em{background:#e3f0e6;color:var(--good)} .mk.bad em{background:#fbe3dd;color:var(--bad)}
.chart-card{padding:14px 14px 12px}
.chart{display:block;width:100%;height:190px}
.chart-label{font-size:11.5px;color:var(--muted);margin-top:6px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:11.5px;color:var(--muted);text-align:left;font-weight:500;padding:0 6px 8px 0}
td{padding:11px 6px 11px 0;border-top:1px solid var(--line);vertical-align:top}
td:last-child,th:last-child{text-align:right;padding-right:0}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600}
.pill.good{background:#e3f0e6;color:var(--good)} .pill.bad{background:#fbe3dd;color:var(--bad)}
.heat-grid{display:grid;grid-template-columns:14px repeat(24,1fr);gap:3px;align-items:center}
.heat{aspect-ratio:1;max-width:100%;border:0;border-radius:50%;padding:0;min-width:0;background:var(--track)}
.heat.hi{background:var(--good)} .heat.mid{background:var(--warn)} .heat.lo{background:var(--bad)}
.heat.now{background:var(--g2);box-shadow:0 0 0 2px rgba(242,112,138,.3)}
.heat.out{background:transparent}
.heat.future,.heat.none{background:rgba(27,26,23,.05)}
.heat-lbl{font-size:9px;color:var(--muted);text-align:center}
.heat-head{font-size:9px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.heat-head.cur{color:var(--g2);font-weight:700}

/* ---------- Preparación ---------- */
.show-card.static{margin-top:4px}
.timeline{padding:8px 18px}
.phase{position:relative;display:grid;grid-template-columns:18px 1fr;gap:12px;padding:14px 0}
.phase::before{content:"";position:absolute;left:8px;top:30px;bottom:-14px;width:1.5px;background:var(--track)}
.phase:last-child::before{display:none}
.phase-dot{position:relative;z-index:1;width:18px;height:18px;border-radius:50%;margin-top:3px;background:var(--solid);border:1.5px solid var(--dim)}
.phase.current .phase-dot{border:0;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 0 0 5px rgba(242,112,138,.18)}
.phase.past .phase-dot{border:0;background:var(--good)}
.phase.past{opacity:.6}
.phase-body small{font-size:11.5px;color:var(--muted)}
.phase h3{margin:2px 0 4px;font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.15;letter-spacing:-.03em}
.phase p{margin:4px 0;color:var(--ink2);font-size:14px;line-height:1.5}
.phase ul{margin:6px 0 0;padding-left:16px;color:var(--muted);font-size:13px;line-height:1.55}

/* ---------- Botones y formularios ---------- */
.btn{border:1px solid var(--glass-b);background:var(--solid);color:var(--ink);padding:13px 16px;border-radius:99px;font-weight:500;font-size:14.5px;text-align:center;box-shadow:0 1px 3px rgba(60,48,30,.08)}
.btn.primary,.btn.dark{background:var(--brown);color:#fff;border-color:var(--brown)}
.btn.danger{color:var(--bad);background:#fbe9e5;border-color:#fbe9e5}
.btn.small{padding:8px 13px;font-size:13px}
.btn:disabled{opacity:.4}
.input-group{display:grid;gap:6px;min-width:0}
.input-group label{font-size:12.5px;color:var(--muted);font-weight:500}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--solid);color:var(--ink);border-radius:14px;padding:12px 14px;outline:none;font-size:16px}
input::placeholder,textarea::placeholder{color:var(--dim)}
input:focus,textarea:focus,select:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(242,112,138,.15)}
textarea{min-height:80px;resize:vertical}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid .span2{grid-column:1/-1}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.q{display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid var(--line);background:var(--solid);border-radius:22px;padding:16px 6px 14px;font-size:13px;font-weight:500;color:var(--ink)}
.q-ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,rgba(247,178,103,.25),rgba(242,112,138,.25))}
.q-ico svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Avisos ---------- */
.alert{padding:13px 16px;font-size:13.5px;line-height:1.45;border-radius:20px;background:#fbf1de;color:#7a5418}
.alert.bad{background:#fbe3dd;color:#8f2f21}
.alert.good{background:#e3f0e6;color:#2f6242}
.alert.warn{background:#fbf1de;color:#7a5418}

/* ---------- Temporizador ---------- */
.timer-bar{position:fixed;z-index:29;left:16px;right:16px;bottom:calc(92px + var(--bottom-safe));max-width:508px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 10px 10px 18px;border-radius:99px;background:var(--brown);color:#fff;box-shadow:0 16px 36px -14px rgba(43,33,27,.7)}
.timer-bar small{display:block;font-size:11px;color:#cdbfb2;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer-bar b{font-size:28px;font-weight:300;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.timer-bar .btn{background:rgba(255,255,255,.1);border-color:transparent;color:#fff;box-shadow:none}
.timer-bar .btn.danger{background:#fff;color:var(--brown)}
.timer-bar.done{background:var(--good)}

/* ---------- Hoja inferior ---------- */
.modal{width:100%;max-width:620px;margin:auto auto 0;border:0;background:#faf8f4;color:var(--ink);border-radius:30px 30px 0 0;padding:0;max-height:90vh;box-shadow:0 -20px 50px rgba(60,48,30,.2)}
.modal[open]{animation:sheet-in .32s cubic-bezier(.2,.8,.2,1)}
@keyframes sheet-in{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.modal::backdrop{background:rgba(43,33,27,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#modalBody{padding:10px 18px calc(24px + var(--bottom-safe));overflow:auto;max-height:88vh}
#modalBody::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--track);margin:0 auto 16px}
#modalBody h2{margin:0 0 14px;font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.1;letter-spacing:-.035em}
.big-input{font-size:58px;font-weight:300;letter-spacing:-.03em;text-align:center;padding:12px;font-variant-numeric:tabular-nums;border-radius:22px}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}

.toast{position:fixed;z-index:80;left:50%;bottom:calc(160px + var(--bottom-safe));transform:translate(-50%,20px);background:var(--brown);color:#fff;padding:11px 18px;border-radius:99px;font-weight:500;font-size:13.5px;opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.divider{height:1px;background:var(--line);margin:16px 0}
.footer-note{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:30px;padding:12px 4px}

@media (max-width:370px){
  .ph h1{font-size:31px}
  .form-grid{grid-template-columns:1fr}
  .form-grid .span2{grid-column:auto}
  .notes>div{grid-template-columns:1fr;gap:2px}
  .fuel-side b{font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  .gauge .anim,.ring .anim,.wbar-track i.grow,.modal[open]{animation:none}
  .toast{transition:none}
  button:active:not(:disabled){transform:none}
}
</style>

  <script>

/* CLASSIC 24 · preparación natural de Classic Physique en 24 semanas.

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

const sum = (a, f = x => x) => a.reduce((t, x) => t + (+f(x) || 0), 0);
const avg = a => a.length ? sum(a) / a.length : 0;
const num = n => Math.round(+n || 0).toLocaleString('es-MX');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const pad = n => String(n).padStart(2, '0');

const todayKey = () => keyOf(new Date());
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const diffDays = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);
const dowOf = k => parseKey(k).getDay();
const mondayOf = k => addDays(k, -((dowOf(k) + 6) % 7));
const weekDates = mon => Array.from({ length: 7 }, (_, i) => addDays(mon, i));
const DOW = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const DOW1 = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
const DOWL = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];

const fmtShort = k => { const d = parseKey(k); return `${d.getDate()} ${MES[d.getMonth()]}`; };
const fmtDay = k => { const d = parseKey(k); return `${DOW[d.getDay()]} ${d.getDate()} ${MES[d.getMonth()]}`; };

// ---------- Programa ----------
// [ejercicio, series, reps mín, reps máx, RIR, descanso en segundos]
const PLAN = {
  1: { name: 'Espalda + hombro', short: 'Espalda', ex: [

  0: { name: 'Descanso total', short: 'Descanso', ex: [] }
};
const TRAIN_DAYS = [1, 2, 4, 5, 6];
// Orden de prioridad si hay que recuperar sesiones: dorsal → deltoide → pecho superior → femoral → resto.
const PRIORITY = [1, 4, 6, 5, 2];
const KEY_LIFTS = [
  { name: 'Press inclinado', plan: 4, i: 0 }, { name: 'Jalón / dominada', plan: 1, i: 0 },

];

// Porciones rápidas (valores aproximados de tablas USDA; ajusta si tu porción es distinta)
const FOODS = [
  ['Pechuga de pollo 200 g', 330, 62, 0, 7], ['Carne magra de res 200 g', 330, 52, 0, 13],
  ['Pescado blanco 200 g', 256, 52, 0, 5], ['Arroz cocido 250 g', 325, 7, 70, 1],
  ['Papa cocida 300 g', 261, 6, 60, 0], ['Avena 80 g', 303, 11, 54, 5],
  ['4 huevos enteros', 288, 25, 2, 19], ['Claras 250 g', 130, 27, 2, 0],
  ['Whey 1 scoop (30 g)', 120, 24, 3, 2], ['3 tortillas de maíz', 196, 5, 40, 3],
  ['Plátano mediano', 105, 1, 27, 0], ['Manzana mediana', 95, 0, 25, 0],
  ['Verduras 200 g', 70, 4, 12, 0], ['Aceite de oliva 10 g', 88, 0, 0, 10],

  if (L.pct1 < slow) return { type: 'warn', text: `${pace} Semana lenta. No cambies nada todavía: si se repite la próxima semana y la cintura tampoco baja, se ajusta.` };

function gauge(p, big, sub) {

// ---------- Gráficas ----------
function lineChart(id, series) {
  const c = document.getElementById(id); if (!c) return;
  const dpr = window.devicePixelRatio || 1, W = c.clientWidth || 320, H = c.clientHeight || 190;
  c.width = W * dpr; c.height = H * dpr;
  const x = c.getContext('2d'); x.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement), col = n => css.getPropertyValue(n).trim();
  const ink = col('--ink');
  x.font = '500 10.5px Geist, -apple-system, sans-serif';
  const pts = series.flatMap(s => s.points);
  if (pts.length < 1) { x.fillStyle = col('--muted'); x.fillText('Sin datos todavía', 14, H / 2); return; }
  const ks = pts.map(p => p.k).sort(), d0 = ks[0], d1 = ks.at(-1), span = Math.max(1, diffDays(d0, d1));
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  const padv = Math.max(0.5, (hi - lo) * 0.15); lo -= padv; hi += padv;
  const Lm = 6, R = 42, T = 10, B = 22;
  const X = k => Lm + (pts.length === 1 ? 0.5 : diffDays(d0, k) / span) * (W - Lm - R);
  const Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  x.strokeStyle = 'rgba(27,26,23,.07)'; x.fillStyle = col('--muted'); x.lineWidth = 1;
  for (let i = 0; i <= 3; i++) { const v = lo + (hi - lo) * i / 3, y = Math.round(Y(v)) + .5; x.beginPath(); x.moveTo(Lm, y); x.lineTo(W - R + 4, y); x.stroke(); x.fillText(round(v, 1).toString(), W - R + 10, y + 4); }
  x.fillText(fmtShort(d0), Lm, H - 5);
  if (d1 !== d0) { const tw = x.measureText(fmtShort(d1)).width; x.fillText(fmtShort(d1), W - R - tw, H - 5); }
  for (const s of series) {
    if (s.line && s.points.length > 1) {
      if (s.area) {
        const g = x.createLinearGradient(0, T, 0, H - B); g.addColorStop(0, 'rgba(242,112,138,.28)'); g.addColorStop(1, 'rgba(247,178,103,0)');
        x.fillStyle = g; x.beginPath(); s.points.forEach((p, i) => i ? x.lineTo(X(p.k), Y(p.v)) : x.moveTo(X(p.k), Y(p.v)));
        x.lineTo(X(s.points.at(-1).k), H - B); x.lineTo(X(s.points[0].k), H - B); x.closePath(); x.fill();
      }
      const lg = x.createLinearGradient(Lm, 0, W - R, 0); lg.addColorStop(0, col('--g1')); lg.addColorStop(.55, col('--g2')); lg.addColorStop(1, col('--g3'));
      x.strokeStyle = lg; x.lineWidth = 3; x.lineJoin = 'round'; x.lineCap = 'round'; x.beginPath(); s.points.forEach((p, i) => i ? x.lineTo(X(p.k), Y(p.v)) : x.moveTo(X(p.k), Y(p.v))); x.stroke();
    }
    if (s.dots) { x.fillStyle = s.line ? col('--g2') : 'rgba(27,26,23,.22)'; s.points.forEach(p => { x.beginPath(); x.arc(X(p.k), Y(p.v), s.line ? 3.5 : 2.5, 0, Math.PI * 2); x.fill(); }); }
  }
  const lastS = series.at(-1).points.at(-1);
  if (lastS) { x.fillStyle = '#fff'; x.beginPath(); x.arc(X(lastS.k), Y(lastS.v), 7, 0, Math.PI * 2); x.fill(); x.fillStyle = ink; x.beginPath(); x.arc(X(lastS.k), Y(lastS.v), 4.5, 0, Math.PI * 2); x.fill(); }
}

// ---------- Temporizador (usa la hora de fin: sigue bien aunque bloquees el iPhone) ----------
const Timer = { end: 0, int: null, ctx: null, hide: null };
function audioUnlock() {
  try { Timer.ctx = Timer.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (Timer.ctx.state === 'suspended') Timer.ctx.resume(); } catch (e) { Timer.ctx = null; }
}
function beep() {
  const a = Timer.ctx; if (!a) return;
  [0, 0.25, 0.5].forEach(t => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(0.25, a.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + t + 0.18); o.connect(g).connect(a.destination); o.start(a.currentTime + t); o.stop(a.currentTime + t + 0.2); });
}
function startTimer(sec, label, onDone) {
  audioUnlock();
  clearInterval(Timer.int); clearTimeout(Timer.hide);
  Timer.end = Date.now() + sec * 1000; Timer.onDone = onDone || null;
  $('#timerLabel').textContent = label || 'Descanso';
  $('#timerBar').classList.remove('done'); $('#timerBar').hidden = false;
  tick(); Timer.int = setInterval(tick, 250);
}
function tick() {
  const left = Math.ceil((Timer.end - Date.now()) / 1000);
  $('#timerLeft').textContent = `${pad(Math.floor(Math.max(0, left) / 60))}:${pad(Math.max(0, left) % 60)}`;
  const ml = $('#modalTimer'); if (ml) ml.textContent = $('#timerLeft').textContent;
  if (left <= 0) {
    clearInterval(Timer.int); beep(); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) { /* no vibra */ }
    $('#timerBar').classList.add('done'); $('#timerLabel').textContent = 'Listo · siguiente serie';
    if (Timer.onDone) { const f = Timer.onDone; Timer.onDone = null; f(); }
    Timer.hide = setTimeout(() => { $('#timerBar').hidden = true; }, 8000);
  }
}
function stopTimer() { clearInterval(Timer.int); Timer.onDone = null; $('#timerBar').hidden = true; }

    <div class="row mt"><button class="btn full" data-act="close">Cancelar</button><button class="btn primary full" data-act="checkin-save" data-key="${key}">Guardar</button></div>`);
}
function customFoodModal() {
  openModal(`<h2>Alimento propio · ${mealSel}</h2><div class="form-grid">
    <div class="input-group span2"><label for="fn">Nombre</label><input id="fn" placeholder="Ej. burrito de machaca"></div>
    <div class="input-group"><label for="fk">Kcal</label><input id="fk" type="number" inputmode="numeric"></div>
    <div class="input-group"><label for="fp">Proteína g</label><input id="fp" type="number" inputmode="numeric"></div>
    <div class="input-group"><label for="fc">Carbos g</label><input id="fc" type="number" inputmode="numeric"></div>
    <div class="input-group"><label for="ff">Grasa g</label><input id="ff" type="number" inputmode="numeric"></div></div>
    <p class="tiny muted">Si dejas las kcal vacías se calculan: P×4 + C×4 + G×9.</p>
    <div class="row mt"><button class="btn full" data-act="close">Cancelar</button><button class="btn primary full" data-act="food-save">Guardar</button></div>`);
}
function posingModal(min) {
  openModal(`<h2>Posing · ${min} min</h2><div id="modalTimer" class="big-input" style="border:0">${pad(min)}:00</div>
    <p class="mini muted">Poses obligatorias, respiración y transiciones. Calidad antes que aguantar por aguantar. Al terminar se registran los minutos.</p>
    <div class="row"><button class="btn full" data-act="close">Cerrar</button><button class="btn primary full" data-act="posing-start" data-min="${min}">Iniciar</button></div>`);
}
function settingsModal() {
  const s = S();
  openModal(`<div class="row between"><h2 style="margin:0">Ajustes</h2><button class="btn small" data-act="close">Cerrar</button></div>
    <div class="form-grid mt">
      <div class="input-group span2"><label for="s-date">Fecha de la competencia</label><input id="s-date" type="date" value="${s.competitionDate}"></div>
      <div class="input-group span2"><label for="s-start">Primer día de registro (antes no cuenta en el panel)</label><input id="s-start" type="date" value="${state.createdAt}"></div>
      <div class="input-group"><label for="s-kcal">Kcal</label><input id="s-kcal" type="number" inputmode="numeric" value="${s.calories}"></div>
      <div class="input-group"><label for="s-p">Proteína g</label><input id="s-p" type="number" inputmode="numeric" value="${s.protein}"></div>
      <div class="input-group"><label for="s-c">Carbos g</label><input id="s-c" type="number" inputmode="numeric" value="${s.carbs}"></div>
      <div class="input-group"><label for="s-f">Grasa g</label><input id="s-f" type="number" inputmode="numeric" value="${s.fat}"></div>
      <div class="input-group"><label for="s-steps">Pasos diarios</label><input id="s-steps" type="number" inputmode="numeric" value="${s.steps}"></div>
      <div class="input-group"><label for="s-sleep">Sueño mínimo (h)</label><input id="s-sleep" type="text" inputmode="decimal" value="${s.sleepTarget}"></div>
      <div class="input-group"><label for="s-cs">Cardio sesiones/sem</label><input id="s-cs" type="number" inputmode="numeric" value="${s.cardioSessions}"></div>
      <div class="input-group"><label for="s-cm">Cardio min/sesión</label><input id="s-cm" type="number" inputmode="numeric" value="${s.cardioMinutes}"></div>
    </div>
    <p class="tiny muted">Macros actuales = ${num(s.protein * 4 + s.carbs * 4 + s.fat * 9)} kcal.</p>
    <button class="btn primary full" data-act="settings-save">Guardar ajustes</button>
    <div class="divider"></div>
    <h3 style="margin:0 0 6px">Tus datos</h3>
    <p class="mini muted" style="margin:0 0 10px">${Cloud.col ? 'Se guardan en este dispositivo y en el espacio privado de tu cuenta de Claude: los ves igual en el iPhone y en la compu.' : 'Se guardan solo en este navegador. Exporta un respaldo cada semana.'}</p>
    <div class="row"><button class="btn full" data-act="export">Exportar respaldo</button><label class="btn full" for="importFile">Importar</label></div>
    <input id="importFile" class="visually-hidden" type="file" accept="application/json,.json" data-change="import">
    <div class="divider"></div>
    <h3 style="margin:0 0 6px">Instalar en el iPhone</h3>
    <p class="mini muted" style="margin:0">Abre la liga en Safari → botón Compartir → "Agregar a pantalla de inicio".</p>
    <div class="divider"></div>
    <button class="btn danger full" data-act="reset">Borrar todo y empezar de cero</button>`);
}

// ---------- Acciones ----------
function setTab(t) { closeModal(); tab = t; animateNext = true; if (t === 'progress') panelWeek = mondayOf(todayKey()); render(); window.scrollTo(0, 0); }
const ACT = {
  settings: () => settingsModal(),
  quick: () => quickModal(),
  close: () => closeModal(),
  day: el => { const n = addDays(view, +el.dataset.n); if (n <= todayKey()) { view = n; render(); } },
  pweek: el => { const n = addDays(panelWeek, +el.dataset.n); if (n <= mondayOf(todayKey())) { panelWeek = n; render(); } },
  item: el => {
    const id = el.dataset.id;
    if (METRICS[id]) return metricModal(id);
    if (id === 'kcal' || id === 'protein') return setTab('nutrition');
    if (id === 'train') return setTab('training');
    if (id === 'creatine') { editDay(view, d => { d.supp = { ...(d.supp || {}), creatine: !(d.supp && d.supp.creatine) }; }); closeModal(); render(); toast(dayOf(view).supp.creatine ? 'Creatina registrada' : 'Creatina desmarcada'); }
  },
  'mv-add': el => { const i = $('#mv'), v = parseNum(i.value); i.value = round((isNaN(v) ? 0 : v) + +el.dataset.n, 2); },
  'mv-set': el => { $('#mv').value = el.dataset.n; },
  'mv-save': el => {
    const what = el.dataset.what, v = parseNum($('#mv').value);
    const n = isNaN(v) ? '' : round(v, 2);
    if ($('#mv').value.trim() && isNaN(v)) return toast('Escribe un número válido');
    if (n !== '' && (isNaN(n) || n < 0)) return toast('Escribe un número válido');
    if (what === 'weight' && n !== '' && (n < 40 || n > 250)) return toast('Revisa el peso: debe estar en kg');
    editDay(view, d => { d[what] = n; });
    closeModal(); render(); toast('Guardado');
  },
  daydetail: el => dayModal(el.dataset.k),
  'goto-day': el => { view = el.dataset.k; closeModal(); setTab('today'); },
  plan: el => { const p = +el.dataset.plan; editWorkout(view, w => { w.plan = p; }); render(); },
  timer: el => startTimer(+el.dataset.sec, el.dataset.name),
  'timer-add': el => { Timer.end += +el.dataset.n * 1000; tick(); },
  'timer-stop': () => stopTimer(),
  meal: el => { mealSel = el.dataset.meal; render(); },
  preset: el => {
    const f = FOODS[+el.dataset.i];
    editFood(view, n => n.foods.push({ name: f[0], meal: mealSel, kcal: f[1], p: f[2], c: f[3], f: f[4] }));
    render(); toast(`${f[0]} → ${mealSel}`);
  },
  'food-custom': () => customFoodModal(),
  'food-save': () => {
    const p = +$('#fp').value || 0, c = +$('#fc').value || 0, f = +$('#ff').value || 0;
    const kcal = +$('#fk').value || Math.round(p * 4 + c * 4 + f * 9);
    editFood(view, n => n.foods.push({ name: $('#fn').value.trim() || 'Alimento', meal: mealSel, kcal, p, c, f }));
    closeModal(); render(); toast('Guardado');
  },
  'food-del': el => { editFood(view, n => n.foods.splice(+el.dataset.i, 1)); render(); },
  'food-repeat': () => {
    for (let i = 1; i <= 7; i++) {
      const k = addDays(view, -i), src = state.nutrition[k];
      if (src && src.foods && src.foods.length) { editFood(view, n => n.foods.push(...clone(src.foods))); render(); return toast(`Copiado de ${fmtDay(k)}`); }
    }
    toast('No hay comidas en los últimos 7 días');
  },
  checkin: () => checkinModal(),
  'checkin-save': el => {
    const key = el.dataset.key;
    editCore(st => { st.weekly[key] = { waist: round(parseNum($('#cw').value) || 0, 1), photos: { front: $('#cp-front').checked, side: $('#cp-side').checked, back: $('#cp-back').checked }, notes: $('#cn').value.trim(), date: todayKey() }; });
    closeModal(); render(); toast('Check-in guardado');
  },
  apply: el => {
    const n = +el.dataset.n, dc = n > 0 ? 25 : -25, df = n > 0 ? 6 : -6;
    editCore(st => { st.settings.calories += n; st.settings.carbs += dc; st.settings.fat += df; });
    render(); toast(`Nuevo objetivo: ${S().calories} kcal · ${S().carbs} C / ${S().fat} G`);
  },
  'posing-timer': el => posingModal(+el.dataset.min),
  'posing-start': el => {
    const min = +el.dataset.min, k = todayKey();
    startTimer(min * 60, 'Posing', () => { editDay(k, d => { d.posing = Math.max(+d.posing || 0, 0) + min; }); toast(`Posing: +${min} min registrados`); if (!$('#modal').open) render(); });
  },
  'settings-save': () => {
    const date = $('#s-date').value, start = $('#s-start').value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return toast('Elige la fecha de la competencia');
    editCore(st => {
      Object.assign(st.settings, { competitionDate: date, calories: +$('#s-kcal').value || st.settings.calories, protein: +$('#s-p').value || st.settings.protein,
        carbs: +$('#s-c').value || st.settings.carbs, fat: +$('#s-f').value || st.settings.fat, steps: +$('#s-steps').value || st.settings.steps,
        sleepTarget: parseNum($('#s-sleep').value) || st.settings.sleepTarget, cardioSessions: +$('#s-cs').value || st.settings.cardioSessions, cardioMinutes: +$('#s-cm').value || st.settings.cardioMinutes });
      if (/^\d{4}-\d{2}-\d{2}$/.test(start)) st.createdAt = start;
    });
    closeModal(); render(); toast('Ajustes guardados');
  },
  export: () => exportData(),
  reset: el => {
    if (!el.dataset.armed) { el.dataset.armed = '1'; el.textContent = 'Toca otra vez para borrar TODO'; setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.textContent = 'Borrar todo y empezar de cero'; } }, 4000); return; }
    const ids = new Set(localBucketIds());
    state = freshState(); state.resetAt = Date.now(); state.coreMod = Date.now();
    saveLocal(); schedule('core', 0); ids.forEach(id => schedule(id, 0));
    closeModal(); view = todayKey(); render(); toast('Datos borrados');
  }
};
const CHG = {
  set: el => {
    const { key, f } = el.dataset, j = +el.dataset.j, n = +el.dataset.n;
    editWorkout(view, w => { const x = w.log[key] || (w.log[key] = { sets: [] }); while (x.sets.length < n) x.sets.push({}); x.sets[j][f] = el.value.trim().replace(',', '.'); });
  },
  setdone: el => {
    const { key, name } = el.dataset, j = +el.dataset.j, n = +el.dataset.n, p = planOf(view);
    editWorkout(view, w => {
      const x = w.log[key] || (w.log[key] = { sets: [] }); while (x.sets.length < n) x.sets.push({});
      const s = x.sets[j]; s.done = el.checked;
      if (el.checked) { const last = lastSession(p, +key.split('_')[1], view), ls = last && last.sets[j]; if (!s.kg && ls && ls.kg) s.kg = ls.kg; if (!s.reps && ls && ls.reps) s.reps = ls.reps; }
    });
    el.closest('.set-row').classList.toggle('is-done', el.checked);
    const row = el.closest('.set-row'), w = state.workouts[view], s = w.log[key].sets[j];
    row.querySelectorAll('input[data-f]').forEach(i => { if (!i.value && s[i.dataset.f]) i.value = s[i.dataset.f]; });
    if (el.checked) {
      if (sessionDone(view) && doneSets(view) === totalSets(p)) { stopTimer(); toast('Entreno completo. Registra cardio si toca.'); }
      else if (view === todayKey()) startTimer(+el.dataset.rest, name);
    }
    const hdr = $('.section-title span'); if (hdr && p === dowOf(view)) hdr.textContent = `${doneSets(view)} / ${totalSets(p)} series`;
  },
  exnote: el => { const { key } = el.dataset, n = +el.dataset.n; editWorkout(view, w => { const x = w.log[key] || (w.log[key] = { sets: Array.from({ length: n }, () => ({})) }); x.note = el.value.trim(); }); },
  manual: el => { editWorkout(view, w => { w.manual = el.checked; }); toast(el.checked ? 'Entreno marcado como hecho' : 'Marca quitada'); },
  supp: el => { const k = el.dataset.k; editDay(view, d => { d.supp = { ...(d.supp || {}), [k]: el.checked }; }); },
  pose: el => { const i = el.dataset.i; editDay(todayKey(), d => { d.poses = { ...(d.poses || {}), [i]: el.checked }; }); },
  import: el => {
    const f = el.files && el.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result), now = Date.now(), st = normalize(data);
        for (const src of [st.daily, st.nutrition, st.workouts]) for (const k in src) src[k]._t = now;
        st.coreMod = now; st.resetAt = state.resetAt;
        state = st; saveLocal(); schedule('core', 0); localBucketIds().forEach(id => schedule(id, 0));
        closeModal(); render(); toast('Respaldo importado');
      } catch (e) { toast('Ese archivo no es un respaldo válido'); }
    };
    r.readAsText(f);
  }
};
async function exportData() {
  const data = JSON.stringify(state, null, 2), filename = `classic24-respaldo-${todayKey()}.json`;
  if (window.claude && typeof window.claude.use === 'function') {
    try {
      const dl = await window.claude.use('downloads');
      if (dl) { await dl.save({ filename, data }); toast('Respaldo guardado'); return; }
    } catch (e) { if (e && e.code === 'declined') return; }
  }
  if (EMBED) { toast('La descarga no está disponible aquí'); return; }
  // En el iPhone, el menú de compartir permite guardarlo en Archivos/iCloud o mandarlo por WhatsApp.
  try {
    const file = new File([data], filename, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Respaldo CLASSIC 24' }); toast('Respaldo listo'); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tab]');
  if (tb) { setTab(tb.dataset.tab); return; }
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled && ACT[el.dataset.act]) ACT[el.dataset.act](el, e);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CHG[el.dataset.change]) CHG[el.dataset.change](el, e); });
$('#modal').addEventListener('click', e => { if (e.target === $('#modal')) closeModal(); });
$('#modal').addEventListener('close', () => { if (Cloud.deferred) render(); });
document.addEventListener('focusout', () => setTimeout(() => { if (Cloud.deferred) requestRender(); }, 60));
document.addEventListener('visibilitychange', () => {
  // Si la app estuvo abierta desde ayer, vuelve a "hoy" al regresar.
  if (document.visibilityState === 'visible' && view < todayKey() && !$('#modal').open && Date.now() - (window.__lastAct || 0) > 30 * 60e3) { view = todayKey(); render(); }
});
document.addEventListener('pointerdown', () => { window.__lastAct = Date.now(); });

if (!EMBED && 'serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
setSync('local');
saveLocal();
render();
initCloud();

</script>
