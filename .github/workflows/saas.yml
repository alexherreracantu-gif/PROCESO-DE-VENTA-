name: Portal Park Point

on:
  push:
    paths: ["saas/**", ".github/workflows/saas.yml"]
  pull_request:
    paths: ["saas/**", ".github/workflows/saas.yml"]

jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_PRUEBAS: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: saas/package-lock.json
      - run: npm ci
      - name: Preparar la base de pruebas (migraciones + catálogo)
        run: |
          psql "$DATABASE_URL_PRUEBAS" -v ON_ERROR_STOP=1 -q -f supabase/pruebas/supabase-minimo.sql
          for f in supabase/migrations/*.sql; do psql "$DATABASE_URL_PRUEBAS" -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql "$DATABASE_URL_PRUEBAS" -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
      - run: npm run lint
      - run: npm run typecheck
      - name: Pruebas (cotizador, reportes y permisos por rol)
        run: npm test
      - run: npm run build
